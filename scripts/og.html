<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #09090b;
        color: #fafafa;
        font-family: "IBM Plex Sans", sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 72px 80px 80px;
        box-sizing: border-box;
        background-image:
          radial-gradient(
            ellipse 90% 55% at 15% -10%,
            rgba(217, 119, 6, 0.08),
            transparent 50%
          ),
          radial-gradient(ellipse 100% 60% at 50% -20%, #15151c, transparent 60%),
          linear-gradient(rgba(39, 39, 42, 0.45) 1px, transparent 1px),
          linear-gradient(90deg, rgba(39, 39, 42, 0.45) 1px, transparent 1px);
        background-size:
          auto,
          auto,
          56px 56px,
          56px 56px;
      }
      .meta {
        font-family: "IBM Plex Mono", monospace;
        font-size: 22px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #71717a;
        margin-bottom: 28px;
      }
      h1 {
        margin: 0 0 28px;
        font-size: 96px;
        font-weight: 600;
        letter-spacing: -0.045em;
        line-height: 0.95;
      }
      h1 span {
        color: #d97706;
      }
      p {
        margin: 0;
        max-width: 18ch;
        font-size: 34px;
        font-weight: 500;
        line-height: 1.25;
        letter-spacing: -0.02em;
        color: #a1a1aa;
      }
      p strong {
        color: #fafafa;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="meta">field notes</div>
    <h1>meta<span>-</span>harness</h1>
    <p>The coding agent is the <strong>muscle</strong>. Something else has to be the <strong>shop</strong>.</p>
  </body>
</html>
